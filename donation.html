<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lovepetchain</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --accent: #2d6a4f;
    --accent-light: #40916c;
    --accent-bg: #edf7f0;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .container { max-width: 640px; margin: 0 auto; padding: 0 24px; }

  /* ── Header ── */
  header { padding: 48px 0 32px; text-align: center; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.85rem;
    margin-bottom: 20px;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--text); }
  header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  header h1 span { color: var(--accent); }
  header p {
    color: var(--text-secondary);
    font-size: 0.95rem;
    max-width: 380px;
    margin: 0 auto;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 28px 32px;
    margin-bottom: 24px;
  }
  .card h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 20px;
  }

  /* ── QR Codes (只在成功页显示) ── */
  .qr-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  .qr-card { text-align: center; }
  .qr-card img {
    width: 100%;
    max-width: 180px;
    border-radius: 10px;
    display: block;
    margin: 0 auto 8px;
    border: 1px solid var(--border);
  }
  .qr-card .label {
    font-size: 0.8rem;
    color: var(--text-secondary);
  }
  .qr-card .label strong { color: var(--text); }

  /* ── Form ── */
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 0.85rem;
    color: var(--text);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group input {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .form-group input:focus { border-color: var(--accent); }
  .form-group input::placeholder { color: #bbb; }
  .form-group .hint {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .submit-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
    font-family: inherit;
  }
  .submit-btn:hover { opacity: 0.9; }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Success ── */
  .success-msg { display: none; }
  .success-msg .check {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
  }
  .success-msg h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 6px; }
  .success-msg .sub {
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin-bottom: 20px;
    text-align: center;
  }
  .success-msg .pay-hint {
    text-align: center;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 16px;
  }
  .back-btn {
    display: block;
    text-align: center;
    padding: 10px;
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 8px;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: background 0.2s;
  }
  .back-btn:hover { background: #dceee2; }

  /* ── Error ── */
  .form-error {
    color: #dc2626;
    font-size: 0.8rem;
    margin-top: 8px;
    display: none;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    header { padding: 32px 0 24px; }
    header h1 { font-size: 1.6rem; }
    .card { padding: 20px; }
    .qr-grid { grid-template-columns: 1fr; gap: 16px; }
  }
</style>
</head>
<body>

<div class="container">

  <header>
    <a class="back-link" href="/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
      返回首页
    </a>
    <h1>喵<span>链</span> · 捐款</h1>
    <p>登记捐款信息，确认到账后记录上链，永不可篡改</p>
  </header>

  <!-- ── Form ── -->
  <div class="card" id="formPanel">
    <h2>提交捐款信息</h2>
    <form id="donateForm">
      <div class="form-group">
        <label>姓名</label>
        <input type="text" id="name" placeholder="您的名字或昵称" required>
      </div>
      <div class="form-group">
        <label>金额 (元)</label>
        <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required>
      </div>
      <div class="form-group">
        <label>项目</label>
        <input type="text" id="project" placeholder="如：救助小橘" value="喵链救助基金">
      </div>
      <div class="form-group">
        <label>留言</label>
        <input type="text" id="message" placeholder="想说的话（选填）">
      </div>
      <div class="form-group">
        <label>支付单号</label>
        <input type="text" id="paymentHash" placeholder="支付宝/微信交易单号" required>
        <div class="hint">先登记信息，提交后会显示收款码，付款后把单号填回来（可暂时随便填）</div>
      </div>
      <div class="form-error" id="formError">提交失败，请重试</div>
      <button class="submit-btn" type="submit" id="submitBtn">提交登记</button>
    </form>
  </div>

  <!-- ── Success ── -->
  <div class="card success-msg" id="successMsg">
    <div style="text-align:center">
      <div class="check">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h2>提交成功</h2>
      <p class="sub">您的捐款信息已登记，请扫码付款，我们核对到账后会记录上链。</p>
    </div>
    <p class="pay-hint">扫码付款</p>
    <div class="qr-grid">
      <div class="qr-card">
        <img src="alipay.jpg" alt="支付宝收款码">
        <div class="label">支付宝</div>
      </div>
      <div class="qr-card">
        <img src="weixin.jpg" alt="微信收款码">
        <div class="label">微信</div>
      </div>
    </div>
    <a class="back-btn" href="/">返回首页</a>
  </div>

</div>

<script>
document.getElementById('donateForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('formError');
  btn.disabled = true;
  btn.textContent = '提交中...';
  err.style.display = 'none';

  const data = {
    donorName: document.getElementById('name').value.trim(),
    amount: Math.round(parseFloat(document.getElementById('amount').value) * 100),
    projectId: document.getElementById('project').value.trim(),
    message: document.getElementById('message').value.trim(),
    paymentHash: document.getElementById('paymentHash').value.trim(),
  };

  if (!data.donorName || !data.amount || !data.paymentHash) {
    err.textContent = '请填写必填字段';
    err.style.display = '';
    btn.disabled = false;
    btn.textContent = '提交登记';
    return;
  }

  try {
    const res = await fetch('/api/donation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error('提交失败');
    document.getElementById('formPanel').style.display = 'none';
    document.getElementById('successMsg').style.display = '';
  } catch {
    err.textContent = '提交失败，请检查网络后重试';
    err.style.display = '';
    btn.disabled = false;
    btn.textContent = '提交登记';
  }
});
</script>
</body>
</html>
