<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵链 · 猫咪救援存证</title>
<script src="https://cdn.bootcdn.net/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --accent: #2d6a4f;
    --accent-light: #40916c;
    --accent-bg: #edf7f0;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ── Layout ── */
  .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

  /* ── Header ── */
  header {
    padding: 64px 0 48px;
    text-align: center;
  }
  header h1 {
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  header h1 span { color: var(--accent); }
  header p {
    color: var(--text-secondary);
    font-size: 1.1rem;
    max-width: 480px;
    margin: 0 auto 24px;
  }

  .contract-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 16px;
    font-size: 0.8rem;
    color: var(--text-secondary);
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .contract-badge:hover { border-color: var(--accent-light); }
  .contract-badge .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .contract-badge code {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.75rem;
  }

  /* ── Stats ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 48px;
  }
  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .stat-card .number {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.2;
  }
  .stat-card .label {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  /* ── Section ── */
  section { margin-bottom: 48px; }
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .section-header h2 {
    font-size: 1.25rem;
    font-weight: 600;
  }
  .section-header .count {
    font-size: 0.85rem;
    color: var(--text-secondary);
    background: var(--accent-bg);
    padding: 4px 12px;
    border-radius: 100px;
  }

  /* ── Table ── */
  .table-wrap {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  thead { background: #f9fafb; }
  th {
    text-align: left;
    padding: 12px 16px;
    font-weight: 500;
    color: var(--text-secondary);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: #fafbfc; }

  td .hash {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 0.8rem;
    color: var(--text-secondary);
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
  }
  td .message {
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-secondary);
  }
  .amount {
    font-weight: 600;
    color: var(--accent);
  }
  .status { display: inline-flex; align-items: center; gap: 4px; font-size: 0.8rem; }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .timestamp {
    font-size: 0.8rem;
    color: var(--text-secondary);
    white-space: nowrap;
  }
  .ipfs-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
  }
  .ipfs-link:hover {
    text-decoration: underline;
    color: var(--accent-light);
  }

  /* ── Buttons ── */
  .scan-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 16px;
    font-size: 0.8rem;
    color: var(--text-secondary);
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
  }
  .scan-btn:hover {
    border-color: var(--accent-light);
    color: var(--accent);
  }
  .scan-btn .icon { display: inline-flex; transition: transform 0.2s; }
  .scan-btn:hover .icon { transform: translateX(2px); }

  /* ── Donate Button ── */
  .donate-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    color: var(--accent);
    font-size: 0.95rem;
    font-weight: 600;
    padding: 10px 32px;
    border: 1px solid var(--border);
    border-radius: 100px;
    text-decoration: none;
    margin-bottom: 20px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .donate-btn:hover { border-color: var(--accent-light); box-shadow: var(--shadow-md); }

  .header-actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* ── Empty / Loading ── */
  .empty {
    text-align: center;
    padding: 48px 16px;
    color: var(--text-secondary);
  }
  .empty p { margin-top: 8px; font-size: 0.9rem; }
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-state { text-align: center; padding: 48px 16px; }
  .error-state .icon { font-size: 2rem; margin-bottom: 8px; display: block; }
  .error-state p { color: #dc2626; font-size: 0.9rem; }
  .error-state .hint { color: var(--text-secondary); font-size: 0.8rem; margin-top: 4px; }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 32px 0 48px;
    color: var(--text-secondary);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
    margin-top: 16px;
  }
  footer a { color: var(--accent); text-decoration: none; }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    header { padding: 40px 0 32px; }
    header h1 { font-size: 1.75rem; }
    .stats { grid-template-columns: 1fr 1fr; }
    .stats .stat-card:last-child { grid-column: span 2; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- ── Header ── -->
  <header>
    <h1>喵<span>链</span></h1>
    <p>每一份善意，都上链存证，永不可篡改</p>
    <a class="donate-btn" href="/donate">我要捐款</a>
    <div class="header-actions">
      <div class="contract-badge" onclick="navigator.clipboard?.writeText(contractAddress)">
        <span class="dot"></span>
        <code id="contractDisplay">加载中...</code>
      </div>
      <a class="scan-btn" href="https://amoy.polygonscan.com/address/0x3dD32B167CF5f057EAA30b5d535F82765f208a46" target="_blank" rel="noopener">
        链上验证
        <span class="icon">
          <svg height="16" width="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 0h24v24H0z" fill="none"/>
            <path d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z" fill="currentColor"/>
          </svg>
        </span>
      </a>
    </div>
  </header>

  <!-- ── Stats ── -->
  <div class="stats" id="stats">
    <div class="stat-card">
      <div class="number" id="donationCount">--</div>
      <div class="label">捐款记录</div>
    </div>
    <div class="stat-card">
      <div class="number" id="taskCount">--</div>
      <div class="label">任务记录</div>
    </div>
    <div class="stat-card">
      <div class="number" id="ownerDisplay">--</div>
      <div class="label">合约管理者</div>
    </div>
  </div>

  <!-- ── Donations ── -->
  <section>
    <div class="section-header">
      <h2>捐款记录</h2>
      <span class="count" id="donationBadge">0</span>
    </div>
    <div class="table-wrap">
      <div id="donationLoading" class="empty">
        <div class="spinner"></div>
        <p>正在从链上读取数据...</p>
      </div>
      <div id="donationError" class="error-state" style="display:none">
        <span class="icon">!</span>
        <p id="donationErrorMsg">读取失败</p>
        <p class="hint">请检查网络连接后刷新页面</p>
      </div>
      <div id="donationContent" style="display:none">
        <table>
          <thead>
            <tr>
              <th>捐赠者</th>
              <th>金额</th>
              <th>项目</th>
              <th>留言</th>
              <th>时间</th>
              <th>交易号</th>
            </tr>
          </thead>
          <tbody id="donationBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ── Tasks ── -->
  <section>
    <div class="section-header">
      <h2>任务记录</h2>
      <span class="count" id="taskBadge">0</span>
    </div>
    <div class="table-wrap">
      <div id="taskLoading" class="empty">
        <div class="spinner"></div>
        <p>正在从链上读取数据...</p>
      </div>
      <div id="taskError" class="error-state" style="display:none">
        <span class="icon">!</span>
        <p id="taskErrorMsg">读取失败</p>
        <p class="hint">请检查网络连接后刷新页面</p>
      </div>
      <div id="taskContent" style="display:none">
        <table>
          <thead>
            <tr>
              <th>执行者</th>
              <th>任务类型</th>
              <th>报酬</th>
              <th>凭证</th>
              <th>时间</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="taskBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ── Footer ── -->
  <footer>
    <p>数据来源：Polygon Amoy 测试链 · 合约地址可点击复制</p>
  </footer>

</div>

<script>
const RPC_PROXY = window.location.origin + '/rpc';
const RPC_DIRECT = 'https://rpc-amoy.polygon.technology';
const contractAddress = '0x3dD32B167CF5f057EAA30b5d535F82765f208a46';
const IPFS_GATEWAY = 'https://aqua-tricky-peafowl-770.mypinata.cloud/ipfs/';

const ABI = [
  'function owner() view returns (address)',
  'function getDonationCount() view returns (uint256)',
  'function getTaskCount() view returns (uint256)',
  'function getDonations(uint256 _offset, uint256 _limit) view returns (tuple(string donorName, uint256 amount, string projectId, string message, uint256 timestamp, string paymentHash)[] memory)',
  'function getTasks(uint256 _offset, uint256 _limit) view returns (tuple(string staffName, string taskType, uint256 reward, string ipfsHash, uint256 timestamp, bool verified)[] memory)',
];

function formatTime(ts) {
  const d = new Date(Number(ts) * 1000);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatAmount(amount) {
  const yuan = Number(amount) / 100;
  return `¥${yuan.toFixed(2)}`;
}

function truncateHash(h) {
  if (!h || h.length < 12) return h || '-';
  return h.slice(0, 6) + '...' + h.slice(-4);
}

async function main() {
  document.getElementById('contractDisplay').textContent = contractAddress;

  let provider, contract;
  async function connectRPC(url) {
    const p = new ethers.JsonRpcProvider(url, undefined, { staticNetwork: true });
    await p.getBlockNumber();
    return p;
  }
  try {
    provider = await connectRPC(RPC_PROXY);
  } catch {
    try {
      provider = await connectRPC(RPC_DIRECT);
      console.log('使用直连 RPC');
    } catch (e) {
      document.getElementById('contractDisplay').textContent = 'RPC 连接失败';
      document.getElementById('contractDisplay').style.color = '#f87171';
      showError('donation');
      showError('task');
      return;
    }
  }
  contract = new ethers.Contract(contractAddress, ABI, provider);

  // ── Owner ──
  try {
    const owner = await contract.owner();
    document.getElementById('ownerDisplay').textContent = truncateHash(owner);
  } catch {
    document.getElementById('ownerDisplay').textContent = '--';
  }

  // ── Stats ──
  let donationTotal = 0, taskTotal = 0;
  try {
    donationTotal = Number(await contract.getDonationCount());
    document.getElementById('donationCount').textContent = donationTotal;
    document.getElementById('donationBadge').textContent = donationTotal;
  } catch { /* keep -- */ }
  try {
    taskTotal = Number(await contract.getTaskCount());
    document.getElementById('taskCount').textContent = taskTotal;
    document.getElementById('taskBadge').textContent = taskTotal;
  } catch { /* keep -- */ }

  // ── Donations ──
  if (donationTotal > 0) {
    try {
      const limit = Math.min(donationTotal, 50);
      const donations = await contract.getDonations(0, limit);
      renderDonations(donations);
    } catch (e) {
      showError('donation', e.message);
    }
  } else {
    showEmpty('donation', '暂无捐款记录');
  }

  // ── Tasks ──
  if (taskTotal > 0) {
    try {
      const limit = Math.min(taskTotal, 50);
      const tasks = await contract.getTasks(0, limit);
      renderTasks(tasks);
    } catch (e) {
      showError('task', e.message);
    }
  } else {
    showEmpty('task', '暂无任务记录');
  }
}

function renderDonations(list) {
  document.getElementById('donationLoading').style.display = 'none';
  document.getElementById('donationError').style.display = 'none';
  const tbody = document.getElementById('donationBody');
  tbody.innerHTML = '';

  if (list.length === 0) {
    showEmpty('donation', '暂无捐款记录');
    return;
  }

  document.getElementById('donationContent').style.display = '';

  list.forEach(d => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${d.donorName || '匿名'}</td>
      <td class="amount">${formatAmount(d.amount)}</td>
      <td>${d.projectId || '-'}</td>
      <td><span class="message" title="${d.message || ''}">${d.message || '-'}</span></td>
      <td class="timestamp">${formatTime(d.timestamp)}</td>
      <td><span class="hash" title="${d.paymentHash || ''}">${truncateHash(d.paymentHash) || '-'}</span></td>
    `;
    tbody.appendChild(tr);
  });
}

function renderTasks(list) {
  document.getElementById('taskLoading').style.display = 'none';
  document.getElementById('taskError').style.display = 'none';
  const tbody = document.getElementById('taskBody');
  tbody.innerHTML = '';

  if (list.length === 0) {
    showEmpty('task', '暂无任务记录');
    return;
  }

  document.getElementById('taskContent').style.display = '';

  list.forEach(t => {
    const tr = document.createElement('tr');
    const verified = t.verified;
    tr.innerHTML = `
      <td>${t.staffName || '匿名'}</td>
      <td>${t.taskType || '-'}</td>
      <td class="amount">${formatAmount(t.reward)}</td>
      <td>
        ${t.ipfsHash ? `<a class="ipfs-link" href="${IPFS_GATEWAY}${t.ipfsHash}" target="_blank" rel="noopener">查看凭证</a>` : '-'}
      </td>
      <td class="timestamp">${formatTime(t.timestamp)}</td>
      <td>
        <span class="status">
          <span class="dot ${verified ? 'green' : 'gray'}"></span>
          ${verified ? '已审核' : '待审核'}
        </span>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function showEmpty(prefix, msg) {
  document.getElementById(prefix + 'Loading').style.display = 'none';
  document.getElementById(prefix + 'Error').style.display = 'none';
  document.getElementById(prefix + 'Content').style.display = '';
  const tbody = document.getElementById(prefix + 'Body');
  tbody.innerHTML = `<tr><td colspan="6"><div class="empty"><p>${msg}</p></div></td></tr>`;
}

function showError(prefix, msg) {
  document.getElementById(prefix + 'Loading').style.display = 'none';
  document.getElementById(prefix + 'Content').style.display = 'none';
  document.getElementById(prefix + 'Error').style.display = '';
  if (msg) document.getElementById(prefix + 'ErrorMsg').textContent = msg;
}

main();
</script>
</body>
</html>
