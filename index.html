<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵链 · 猫咪救助存证</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.bootcdn.net/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
</head>
<body>

<div class="container">

  <!-- ── Header ── -->
  <header>
    <h1>喵<span>链</span></h1>
    <div class="header-actions">
      <div class="contract-badge" onclick="navigator.clipboard?.writeText(CONTRACT_ADDRESS)">
        <span class="dot"></span>
        <code id="contractDisplay">加载中...</code>
      </div>
      <a class="scan-btn" id="scanLink" href="#" target="_blank" rel="noopener">
        所有记录已永久存证
        <span class="icon">
          <svg height="16" width="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 0h24v24H0z" fill="none"/>
            <path d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z" fill="currentColor"/>
          </svg>
        </span>
      </a>
      <a class="entry-btn" href="submit.html">我也帮过毛孩子 →</a>
    </div>
  </header>

  <!-- ── Stats ── -->
  <div class="stats">
    <div class="stat-card">
      <div class="number" id="catCount">--</div>
      <div class="label">建档猫咪</div>
    </div>
    <div class="stat-card">
      <div class="number" id="helpCount">--</div>
      <div class="label">帮助记录</div>
    </div>
    <div class="stat-card">
      <div class="number" id="ownerDisplay">--</div>
      <div class="label">合约管理者</div>
    </div>
  </div>

  <!-- ── Cat wall ── -->
  <section>
    <div class="section-header">
      <h2>小猫墙</h2>
      <span class="count" id="catBadge">0</span>
    </div>
    <div class="cat-hint" id="catHint">
      <span class="cat-hint-emoji">👇</span>
      <span>点击我们呀~看看哥哥姐姐是怎么帮助我们哒~</span>
    </div>
    <div id="catWallLoading" class="empty">
      <div class="spinner"></div>
      <p>正在加载猫咪档案...</p>
    </div>
    <div id="catWall" class="cat-wall" style="display:none"></div>
  </section>

  <!-- ── Volunteer wall ── -->
  <section>
    <div class="section-header">
      <h2>志愿者墙</h2>
      <span class="count" id="volBadge">0</span>
    </div>
    <div id="volLoading" class="empty">
      <div class="spinner"></div>
      <p>正在加载志愿者...</p>
    </div>
    <div id="volWall" class="vol-wall" style="display:none"></div>
  </section>

  <!-- ── Footer ── -->
  <footer>
    <p>数据来源：Polygon Amoy Testnet · 合约地址可点击复制</p>
    <p class="brand-line"><span class="brand-cn">乐盼</span> <span class="brand-sep">|</span> l<span class="brand-heart">♥</span>vepet</p>
  </footer>

</div>

<script src="app.js"></script>
<script>
async function main() {
  const addr = CONTRACT_ADDRESS;
  document.getElementById('contractDisplay').textContent = addr;
  document.getElementById('scanLink').href = 'https://amoy.polygonscan.com/address/' + addr;

  // 链下：猫咪档案（不依赖合约，先渲染）
  let cats = [];
  try {
    cats = await loadCats();
  } catch { /* 无档案则空墙 */ }
  renderCatWall(cats, []);

  // 链下：志愿者档案（不依赖合约，先渲染）
  let volunteers = [];
  try {
    volunteers = await loadVolunteers();
  } catch { /* 无档案则空墙 */ }
  renderVolunteerWall(volunteers, []);

  // 链上：帮助记录
  let contract;
  try {
    contract = await getContract();
  } catch {
    document.getElementById('contractDisplay').textContent = 'RPC 连接失败';
    document.getElementById('contractDisplay').style.color = '#f87171';
    renderVolunteerWall(volunteers, []);
    return;
  }

  let helps = [];
  let helpTotal = 0;
  try {
    helpTotal = Number(await contract.getHelpCount());
    document.getElementById('helpCount').textContent = helpTotal;
    if (helpTotal > 0) {
      helps = await contract.getHelps(0, Math.min(helpTotal, 50));
    }
  } catch { /* 计数读取失败：猫墙按 0 条帮助显示 */ }

  renderCatWall(cats, helps);
  renderVolunteerWall(volunteers, helps);

  // 合约管理者
  try {
    const owner = await contract.owner();
    document.getElementById('ownerDisplay').textContent = truncateHash(owner);
  } catch { /* keep -- */ }
}

function renderCatWall(cats, helps) {
  document.getElementById('catWallLoading').style.display = 'none';
  const wall = document.getElementById('catWall');
  document.getElementById('catBadge').textContent = cats.length;
  document.getElementById('catCount').textContent = cats.length;

  if (!cats.length) {
    wall.style.display = 'block';
    wall.innerHTML = '<div class="empty"><p>暂无建档猫咪</p></div>';
    return;
  }

  const countByCat = {};
  helps.forEach(h => { countByCat[h.catId] = (countByCat[h.catId] || 0) + 1; });

  wall.style.display = 'grid';
  wall.innerHTML = cats.map(c => {
    const n = countByCat[c.catId] || 0;
    const photo = c.photo
      ? `<img class="cat-photo" src="${escapeHtml(c.photo)}" alt="${escapeHtml(c.name)}">`
      : `<div class="cat-photo">🐱</div>`;
    return `<a class="cat-card" href="cat.html?catId=${encodeURIComponent(c.catId)}">
      ${photo}
      <div class="cat-info">
        <div class="cat-name">${escapeHtml(c.name)}</div>
        <div class="cat-meta">
          <span>${escapeHtml(c.location || '')}</span>
          <span>${n} 条帮助</span>
        </div>
      </div>
    </a>`;
  }).join('');
}

function renderVolunteerWall(vols, helps) {
  document.getElementById('volLoading').style.display = 'none';
  const wall = document.getElementById('volWall');
  document.getElementById('volBadge').textContent = vols.length;

  if (!vols.length) {
    wall.style.display = 'block';
    wall.innerHTML = '<div class="empty"><p>暂无志愿者</p></div>';
    return;
  }

  wall.style.display = 'grid';
  wall.innerHTML = vols.map(v => {
    const n = new Set(helpsForVolunteer(v, helps).map(h => h.catId).filter(Boolean)).size;
    const avatar = v.photo
      ? `<img class="vol-avatar" src="${escapeHtml(v.photo)}" alt="${escapeHtml(v.name)}">`
      : `<div class="vol-avatar">${escapeHtml(v.name.slice(0, 1))}</div>`;
    return `<a class="vol-card" href="volunteer.html?volunteerId=${encodeURIComponent(v.volunteerId)}">
      ${avatar}
      <div class="vol-name">${escapeHtml(v.name)}</div>
      <div class="vol-meta">帮了 ${n} 只</div>
    </a>`;
  }).join('');
}

// 小猫墙提示：晃动几秒后停下来（仍保留在页面上）
setTimeout(() => {
  document.getElementById('catHint')?.classList.add('still');
}, 8000);

main();
</script>

</body>
</html>
